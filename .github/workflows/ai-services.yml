name: AI services
on:
  pull_request:
    paths:
      - "ai_services/**"
      - ".github/workflows/ai-services.yml"
  push:
    branches: ["feat/ai-services"]
    paths:
      - "ai_services/**"
      - ".github/workflows/ai-services.yml"
jobs:
  service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            ai_services/requirements-runtime.lock
            ai_services/requirements-test.lock
      - run: python -m pip install -r ai_services/requirements-test.lock
      - run: python -m pytest ai_services/tests -q
      - run: python -m compileall -q ai_services
